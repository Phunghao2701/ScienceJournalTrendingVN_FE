version: '3.8'

services:
  frontend:
    build:
      context: .
      args:
        # Đưa các biến môi trường từ file .env vào quá trình build của Docker
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    image: ghcr.io/researchpulse/scientificjournalsystem-fe:latest
    container_name: researchpulse_frontend
    restart: unless-stopped

    ports:
      # Bạn có thể đổi port 3000 thành port khác nếu muốn
      - "8083:80"

    env_file:
      - .env

    networks:
      - researchpulse_network

networks:
  researchpulse_network:
    external: true
    name: researchpulse_network
