server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kích hoạt Gzip để nén file, giúp tải trang nhanh hơn
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        # Hỗ trợ React Router (SPA)
        try_files $uri $uri/ /index.html;
        
        # Không cache file index.html để luôn nhận được bản cập nhật mới nhất
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cấu hình cache vĩnh viễn (1 năm) cho các file tĩnh trong thư mục /assets/ do Vite sinh ra
    # (Vì Vite đã tự động thêm mã hash vào tên file nên cache lâu không sợ bị lỗi thời)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}