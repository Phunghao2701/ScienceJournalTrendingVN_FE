server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kích hoạt Gzip để nén file, giúp tải trang nhanh hơn
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Không bao giờ cache index.html để luôn cập nhật bản mới nhất
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cấu hình cache vĩnh viễn (1 năm) cho các file tĩnh trong thư mục /assets/ do Vite sinh ra (hashed)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cấu hình cache cho các tài nguyên tĩnh khác (ảnh, icon, font)
    location ~* \.(?:ico|png|jpe?g|gif|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        # Hỗ trợ React Router (SPA)
        try_files $uri $uri/ /index.html;
    }
}